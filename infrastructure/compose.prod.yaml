name: ems

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env 
  # Application
  ENVIRONMENT: production
  # Python
  PYTHONUNBUFFERED: "1"
  # Postgres
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: db
  # InfluxDB — only for the one-off `src.import_influx_history`; remove with the service
  INFLUXDB_HOST: http://influxdb:8181
  INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
  INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
  # JWT
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  # Celery
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  client:
    image: ghcr.io/lilianluca/ems-client:${IMAGE_TAG:-latest}
    # Explicit name: every project on `edge` shares one DNS namespace,
    # and the Caddyfile proxies to this hostname.
    container_name: ems-client
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
      - internal
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    image: ghcr.io/lilianluca/ems-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment: *app-env
    networks:
      - internal
    command:
      - uv
      - run
      - uvicorn
      - src.main:app
      - --host=0.0.0.0
      - --port=8000
      # Trust the two proxy hops (Caddy → client nginx) so request.url.scheme
      # is https and the client IP is the real one.
      - --proxy-headers
      - "--forwarded-allow-ips=*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health")
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: `docker compose -f compose.prod.yaml run --rm migrate`.
  # In a `tools` profile so it never starts as part of `up`.
  migrate:
    image: ghcr.io/lilianluca/ems-server:${IMAGE_TAG:-latest}
    profiles:
      - tools
    restart: "no"
    logging: *logging
    environment: *app-env
    networks:
      - internal
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    # Postgres with the TimescaleDB extension, which holds the time series
    # (prices, forecasts, battery states) as hypertables. The library has to be
    # preloaded; the image only configures that for a freshly initialised data
    # directory, so it is set here to cover an existing one too.
    image: timescale/timescaledb:latest-pg18
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    restart: unless-stopped
    logging: *logging
    networks:
      - internal
    # Bound to the host loopback, never 0.0.0.0 — unreachable from the internet,
    # reachable through an SSH tunnel for pgAdmin/psql from a laptop.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No longer used by the application. Kept for one release so the history can
  # be imported into TimescaleDB (`src.import_influx_history`); remove afterwards
  # together with the INFLUXDB_* variables and the influxdb_data volume.
  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    logging: *logging
    networks:
      - internal
    command:
      - influxdb3
      - serve
      - --node-id=ems-node
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      # Core never compacts, so every rewrite of the same window adds files that
      # a query over it has to scan. The default of 432 is reached within days.
      - --query-file-limit=2000
    volumes:
      - influxdb_data:/var/lib/influxdb3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    image: ghcr.io/lilianluca/ems-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment: *app-env
    networks:
      - internal
    command: uv run celery -A src.core.celery_app worker --pool=threads --concurrency=4 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/lilianluca/ems-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment: *app-env
    networks:
      - internal
    # The schedule file is intentionally not persisted: every entry is a crontab
    # schedule, so a restart simply re-arms them at the next matching minute.
    command: uv run celery -A src.core.celery_app beat -s /tmp/celerybeat-schedule --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

networks:
  # Shared with the Caddy proxy and every other project on the host.
  edge:
    external: true
  # Private to this stack — nothing here is reachable from the internet.
  internal:

volumes:
  db_data:
  influxdb_data:
  redis_data:
