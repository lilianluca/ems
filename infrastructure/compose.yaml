name: ems

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ../server:/app # bind mount → hot-reload
      - /app/.venv # anonymous volume → isolates the virtual environment from the host machine
    ports:
      - "8000:8000"
    environment:
      # Application
      - ENVIRONMENT=${ENVIRONMENT}
      # Python
      - PYTHONUNBUFFERED=1
      # Postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      target: dev
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ../client:/app # bind mount → hot-reload
      - /app/node_modules # anonymous volume → keeps container's node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

  db:
    # Postgres with the TimescaleDB extension, which holds the time series
    # (prices, forecasts, battery states) as hypertables. The library has to be
    # preloaded; the image only configures that for a freshly initialised data
    # directory, so it is set here to cover an existing one too.
    image: timescale/timescaledb:latest-pg18
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ../server:/app
      - /app/.venv
    environment:
      # Application
      - ENVIRONMENT=${ENVIRONMENT}
      # Python
      - PYTHONUNBUFFERED=1
      # Postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uv run celery -A src.core.celery_app worker --pool=threads --concurrency=4 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ../server:/app
      - /app/.venv
    environment:
      # Application
      - ENVIRONMENT=${ENVIRONMENT}
      # Python
      - PYTHONUNBUFFERED=1
      # Postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uv run celery -A src.core.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
