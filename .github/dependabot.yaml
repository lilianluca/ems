version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node runtime major (client/.nvmrc); bump manually with Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /client
      - /server
    schedule:
      interval: weekly
    ignore:
      # Node major is bumped manually together with client/.nvmrc
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
