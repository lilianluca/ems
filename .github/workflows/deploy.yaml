name: Deploy

# Deploys are deliberate: pushing a version tag ships it. Merges to main — including
# Dependabot and documentation changes — only run CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy, e.g. v0.1.0 (leave empty to build the current ref)"
        required: false
        type: string

# Never let two deploys overlap, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lilianluca/ems

jobs:
  # Decides what to deploy, in one place, so the other jobs stay readable:
  #   tag push        → the version tag, e.g. v0.1.0
  #   manual, blank   → the commit SHA of the selected ref
  #   manual, filled  → that existing tag, and skip the build
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.target.outputs.image_tag }}
      build: ${{ steps.target.outputs.build }}
    steps:
      - name: Determine image tag
        id: target
        env:
          # Via env rather than inline ${{ }} so the value cannot be interpreted
          # as shell by the runner.
          REQUESTED_TAG: ${{ inputs.image_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            image_tag="$REQUESTED_TAG"
            build=false
          elif [ "$REF_TYPE" = "tag" ]; then
            image_tag="$REF_NAME"
            build=true
          else
            image_tag="$COMMIT_SHA"
            build=true
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Deploying tag '$image_tag' (build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: resolve
    # Skipped when redeploying an image that already exists.
    if: ${{ needs.resolve.outputs.build == 'true' }}
    strategy:
      matrix:
        include:
          - component: server
            context: server
            target: ""
          - component: client
            context: client
            target: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # The version tag is what gets deployed and is readable in `docker ps`;
          # the SHA tag guarantees every build is addressable even without one.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ needs.resolve.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [resolve, build]
    # Runs after a successful build, or straight away on a rollback dispatch.
    if: ${{ always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: production
    env:
      DEPLOY_USER: deploy
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          scp -o BatchMode=yes infrastructure/compose.prod.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/ems/compose.prod.yaml"

      - name: Run deployment
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "IMAGE_TAG='$IMAGE_TAG'"
            echo "GHCR_USER='$GHCR_USER'"
            echo "GHCR_TOKEN='$GHCR_TOKEN'"
            cat infrastructure/deploy.sh
          } | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 https://ems.lilianluca.com/api/v1/health; then
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          exit 1
